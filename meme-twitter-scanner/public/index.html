<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推特CA扫描神器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0e11;color:#eaecef;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
.header{background:#1a1d23;border-bottom:1px solid #2b2f36;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;color:#00c853}
.hdr-right{display:flex;align-items:center;gap:12px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;background:#f44336}
.dot.on{background:#00c853}
.ctrl{background:#1a1d23;border-bottom:1px solid #2b2f36;padding:10px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.b{padding:5px 14px;border-radius:5px;border:1px solid #2b2f36;background:0;color:#848e9c;cursor:pointer;font-size:12px;transition:.2s}
.b.a{background:#00c853;color:#000;border-color:#00c853;font-weight:600}
.b:hover:not(.a){border-color:#848e9c;color:#eaecef}
.st{margin-left:auto;display:flex;gap:18px;font-size:12px;color:#848e9c}
.sv{color:#eaecef;font-weight:600}
.main{display:flex;height:calc(100vh - 100px)}
.p{overflow-y:auto;padding:14px}
.pl{flex:2;border-right:1px solid #2b2f36}
.pr{flex:1}
.p h2{font-size:14px;color:#848e9c;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #2b2f36}
.p h2.g{color:#00c853}
.c{background:#1a1d23;border:1px solid #00c853;border-radius:8px;padding:14px;margin-bottom:10px;animation:si .3s}
.c.fl{animation:fg 1.5s}
@keyframes si{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fg{0%{border-color:#0f0;box-shadow:0 0 20px rgba(0,200,83,.5)}100%{border-color:#00c853;box-shadow:none}}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tn{font-size:15px;font-weight:700;color:#fff}
.tg{padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase}
.tg.sol{background:rgba(153,69,255,.2);color:#b388ff}
.tg.bsc{background:rgba(243,186,47,.2);color:#f3ba2f}
.r{display:flex;align-items:flex-start;margin-bottom:5px;font-size:12px}
.lb{color:#848e9c;min-width:72px;flex-shrink:0}
.vl{color:#eaecef;word-break:break-all}
.vl a{color:#1e88e5;text-decoration:none}
.vl a:hover{text-decoration:underline}
.ad{font-family:'Courier New',monospace;font-size:11px;background:#0b0e11;padding:2px 5px;border-radius:3px;cursor:pointer}
.ad:hover{background:#2b2f36}
.tw{background:#0b0e11;border-left:3px solid #00c853;padding:7px 10px;margin-top:6px;border-radius:0 4px 4px 0;font-size:12px;color:#b7bdc6;white-space:pre-wrap;word-break:break-word}
.tm{color:#848e9c;font-size:10px;text-align:right;margin-top:4px}
.fi{padding:6px 10px;margin-bottom:4px;border-radius:5px;background:#1a1d23;font-size:11px;border-left:3px solid #2b2f36}
.fi.ht{border-left-color:#1e88e5}
.fi.ck{border-left-color:#ff9800}
.fn{font-weight:600;color:#eaecef;margin-bottom:1px}
.fd{color:#848e9c;font-size:10px}
.em{text-align:center;padding:50px 20px;color:#848e9c}
.em .ic{font-size:40px;margin-bottom:12px}
.tt{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#00c853;color:#000;padding:7px 18px;border-radius:5px;font-size:12px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.tt.s{opacity:1}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#0b0e11}
::-webkit-scrollbar-thumb{background:#2b2f36;border-radius:3px}
.lb2{background:#0b0e11;border:1px solid #2b2f36;border-radius:6px;padding:10px;margin:10px 20px;max-height:160px;overflow-y:auto;font-family:monospace;font-size:11px;color:#848e9c;display:none}
.lb2.s{display:block}
.hl{color:#ff0;background:rgba(255,255,0,.15);padding:0 2px;border-radius:2px}
.manual-link{display:inline-block;margin-left:8px;font-size:11px;padding:1px 6px;background:#2b2f36;border-radius:3px;color:#1e88e5;text-decoration:none}
.manual-link:hover{background:#3b3f46}
</style>
</head>
<body>
<div class="header">
  <h1>推特CA扫描神器</h1>
  <div class="hdr-right">
    <span><span class="dot" id="solD"></span>SOL: <span id="solS">离线</span></span>
    <span><span class="dot" id="bscD"></span>BSC: <span id="bscS">离线</span></span>
    <button class="b" id="sndB" onclick="tglSnd()">声音 关</button>
    <button class="b" onclick="tglLog()">日志</button>
  </div>
</div>
<div class="ctrl">
  <button class="b a" onclick="flt('all',this)">全部</button>
  <button class="b" onclick="flt('sol',this)">SOL</button>
  <button class="b" onclick="flt('bsc',this)">BSC</button>
  <div class="st">
    <span>匹配: <span class="sv" id="nM">0</span></span>
    <span>扫描: <span class="sv" id="nS">0</span></span>
    <span>已查: <span class="sv" id="nC">0</span></span>
    <span>队列: <span class="sv" id="nQ">0</span></span>
  </div>
</div>
<div class="lb2" id="logB"></div>
<div class="main">
  <div class="p pl">
    <h2 class="g">合约地址匹配结果</h2>
    <div id="mL"><div class="em"><div class="ic">&#128269;</div><p>等待匹配中...</p><p style="margin-top:6px;font-size:11px">当新币的推特发布了其合约地址，将在这里显示</p></div></div>
  </div>
  <div class="p pr">
    <h2>实时新币流</h2>
    <div id="fL"><div class="em"><div class="ic">&#9201;</div><p>正在连接数据源...</p></div></div>
  </div>
</div>
<div class="tt" id="toast">已复制!</div>

<script>
// ===== 状态 =====
let CF='all',sndOn=false,matches=[],feeds=[],nS=0,nC=0,nM=0,audioCtx=null;
const Q=[]; let qRun=false;
const cache=new Map(), CTTL=30*60000, CI=1000;

// CORS代理列表
const PXS=[
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://corsproxy.io/?'+encodeURIComponent(u),
  u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u),
];

// Nitter RSS源(最可靠的获取推文方式)
const NITTER_RSS=[
  'https://nitter.poast.org',
  'https://xcancel.com',
  'https://nitter.privacydev.net',
];

// ===== 日志 =====
function L(m,t='info'){
  const b=document.getElementById('logB');
  const cs={info:'#848e9c',ok:'#00c853',warn:'#ff9800',err:'#f44336',match:'#00ff6a'};
  const ts=new Date().toLocaleTimeString('zh-CN',{hour12:false});
  b.innerHTML+=`<div style="color:${cs[t]||'#848e9c'}">[${ts}] ${m}</div>`;
  b.scrollTop=b.scrollHeight;
  if(b.children.length>500)b.removeChild(b.firstChild);
}
function tglLog(){document.getElementById('logB').classList.toggle('s')}

// ===== 声音 =====
function initA(){audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function beep(){
  if(!sndOn||!audioCtx)return;
  try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);
  o.frequency.setValueAtTime(880,audioCtx.currentTime);o.frequency.setValueAtTime(1100,audioCtx.currentTime+.1);o.frequency.setValueAtTime(1320,audioCtx.currentTime+.2);
  g.gain.setValueAtTime(.3,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.6);o.start();o.stop(audioCtx.currentTime+.6)}catch(e){}
}
function tglSnd(){if(!audioCtx)initA();sndOn=!sndOn;const b=document.getElementById('sndB');b.textContent=sndOn?'声音 开':'声音 关';b.classList.toggle('a',sndOn);if(sndOn&&Notification.permission==='default')Notification.requestPermission()}

// ===== 界面 =====
function flt(c,btn){CF=c;document.querySelectorAll('.ctrl .b').forEach(b=>b.classList.remove('a'));btn.classList.add('a');rM();rF()}
function uS(){document.getElementById('nM').textContent=nM;document.getElementById('nS').textContent=nS;document.getElementById('nC').textContent=nC;document.getElementById('nQ').textContent=Q.length}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=String(s);return d.innerHTML}
function ft(ts){if(!ts)return'';const d=new Date(ts);return d.toLocaleTimeString('zh-CN',{hour12:false})+' '+d.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'})}
function cp(a){navigator.clipboard.writeText(a).then(()=>{const t=document.getElementById('toast');t.classList.add('s');setTimeout(()=>t.classList.remove('s'),1200)})}

function rM(){
  const el=document.getElementById('mL');
  const ls=CF==='all'?matches:matches.filter(m=>m.chain===CF);
  if(!ls.length){el.innerHTML='<div class="em"><div class="ic">&#128269;</div><p>暂无匹配</p></div>';return}
  el.innerHTML=ls.map((m,i)=>`
    <div class="c ${i===0?'fl':''}">
      <div class="ch"><span class="tn">${esc(m.name)}</span><span class="tg ${m.chain}">${m.chain.toUpperCase()}</span></div>
      <div class="r"><span class="lb">合约:</span><span class="vl"><span class="ad" onclick="cp('${esc(m.ca)}')" title="点击复制">${esc(m.ca)}</span></span></div>
      <div class="r"><span class="lb">推特:</span><span class="vl"><a href="https://x.com/${esc(m.tw)}" target="_blank">@${esc(m.tw)}</a><a class="manual-link" href="https://x.com/${esc(m.tw)}" target="_blank">打开推特</a></span></div>
      ${m.mc?`<div class="r"><span class="lb">市值:</span><span class="vl">${esc(m.mc)}</span></div>`:''}
      ${(m.mTw||[]).map(t=>`<div class="tw">${hlA(esc(t),esc(m.ca))}</div>`).join('')}
      ${m.mBio?'<div class="tw" style="border-left-color:#1e88e5">在推特简介中找到合约地址</div>':''}
      <div class="tm">${ft(m.ts)}</div>
    </div>`).join('')}

function hlA(t,a){if(!a||a.length<10)return t;const i=t.toLowerCase().indexOf(a.toLowerCase());if(i===-1)return t;return t.substring(0,i)+'<span class="hl">'+t.substring(i,i+a.length)+'</span>'+t.substring(i+a.length)}

function rF(){
  const el=document.getElementById('fL');
  const ls=CF==='all'?feeds:feeds.filter(f=>f.chain===CF);
  if(!ls.length){el.innerHTML='<div class="em"><div class="ic">&#9201;</div><p>等待新币...</p></div>';return}
  el.innerHTML=ls.slice(0,150).map(f=>`
    <div class="fi ${f.tw?'ht':''} ${f.ck?'ck':''}">
      <div class="fn">${esc(f.name)} <span class="tg ${f.chain}" style="font-size:9px">${f.chain.toUpperCase()}</span></div>
      <div class="fd">${f.ca?esc(f.ca.substring(0,6))+'...'+esc(f.ca.slice(-4)):''} ${f.tw?'| @'+esc(f.tw):''} | ${ft(f.ts)}</div>
    </div>`).join('')}

function addFeed(tk){feeds.unshift(tk);if(feeds.length>500)feeds=feeds.slice(0,500);nS++;rF();uS()}

// ===== SOL链: PumpPortal WebSocket =====
let solWs=null,solRD=1000;
function connSOL(){
  L('正在连接PumpPortal (SOL)...');
  try{solWs=new WebSocket('wss://pumpportal.fun/api/data')}catch(e){L('WebSocket连接失败: '+e.message,'err');setTimeout(connSOL,solRD);return}
  solWs.onopen=()=>{L('SOL 已连接','ok');document.getElementById('solD').classList.add('on');document.getElementById('solS').textContent='在线';solRD=1000;solWs.send(JSON.stringify({method:'subscribeNewToken'}))};
  solWs.onmessage=async(ev)=>{
    try{
      const d=JSON.parse(ev.data);if(!d.mint)return;
      const tk={name:d.name||d.symbol||'未知',ca:d.mint,chain:'sol',tw:null,mc:d.marketCapSol?Number(d.marketCapSol).toFixed(1)+' SOL':null,uri:d.uri||null,ts:Date.now()};
      addFeed(tk);
      if(tk.uri)fetchMeta(tk);
    }catch(e){}};
  solWs.onclose=()=>{L('SOL断开，正在重连...','warn');document.getElementById('solD').classList.remove('on');document.getElementById('solS').textContent='离线';solRD=Math.min(solRD*2,30000);setTimeout(connSOL,solRD)};
  solWs.onerror=()=>{solWs.close()}}

// 获取IPFS元数据提取推特账号
async function fetchMeta(tk){
  let url=tk.uri;if(!url)return;
  if(url.startsWith('ipfs://'))url='https://ipfs.io/ipfs/'+url.slice(7);
  try{
    let d=null;
    // 直接获取
    try{const r=await fetch(url,{signal:AbortSignal.timeout(6000)});if(r.ok)d=await r.json()}catch(e){
      // CORS代理兜底
      for(const px of PXS){try{const r=await fetch(px(url),{signal:AbortSignal.timeout(6000)});if(r.ok){d=await r.json();break}}catch(e2){}}
    }
    if(!d)return;
    let tw=d.twitter||d.x||'';
    if(!tw&&d.extensions)tw=d.extensions.twitter||d.extensions.x||'';
    if(!tw&&d.social)tw=d.social.twitter||d.social.x||'';
    if(tw){
      const m=tw.match(/(?:twitter\.com|x\.com)\/([A-Za-z0-9_]+)/);
      tw=m?m[1]:tw.replace(/^@/,'').replace(/^https?:\/\//,'').split('/')[0].trim();
      if(tw&&tw.length>=2&&tw.length<=15){
        tk.tw=tw;const i=feeds.findIndex(f=>f.ca===tk.ca);if(i>=0)feeds[i].tw=tw;rF();
        enqueue(tk)}}
  }catch(e){}}

// ===== BSC链: GeckoTerminal新池子 =====
let bscSeen=new Set();
async function startBSC(){
  L('正在启动BSC扫描 (GeckoTerminal)...');
  document.getElementById('bscD').classList.add('on');
  document.getElementById('bscS').textContent='轮询中';
  pollBSC()}

async function pollBSC(){
  try{
    let data=null;
    const url='https://api.geckoterminal.com/api/v2/networks/bsc/new_pools?include=base_token&page=1';
    // 直接获取(GeckoTerminal支持CORS)
    try{const r=await fetch(url,{signal:AbortSignal.timeout(12000),headers:{Accept:'application/json'}});if(r.ok)data=await r.json()}catch(e){
      L('GeckoTerminal直连失败，尝试代理...','warn');
      for(const px of PXS){try{const r=await fetch(px(url),{signal:AbortSignal.timeout(12000)});if(r.ok){data=await r.json();break}}catch(e2){}}}

    if(data&&data.data&&Array.isArray(data.data)){
      L(`BSC获取到 ${data.data.length} 个新池子`,'ok');

      // 构建included里的token信息映射
      const tokenMap={};
      if(data.included&&Array.isArray(data.included)){
        for(const inc of data.included){
          if(inc.type==='token'&&inc.attributes){tokenMap[inc.id]=inc.attributes}}}

      for(const pool of data.data){
        const attr=pool.attributes||{};
        const rel=pool.relationships||{};
        const btId=rel.base_token&&rel.base_token.data?rel.base_token.data.id:'';
        // btId格式: "bsc_0xADDRESS"
        const addr=btId.startsWith('bsc_')?btId.slice(4):btId;
        if(!addr||bscSeen.has(addr))continue;
        bscSeen.add(addr);

        // 从included获取token名
        const tInfo=tokenMap[btId]||{};
        const name=tInfo.name||tInfo.symbol||attr.name||'未知';

        const tk={name,ca:addr,chain:'bsc',tw:null,mc:attr.fdv_usd?'$'+Number(attr.fdv_usd).toLocaleString():null,ts:Date.now()};
        addFeed(tk);

        // 尝试从DexScreener获取推特
        lookupBscTwitter(tk)}}
    else{L('BSC数据为空或格式异常','warn')}
  }catch(e){L('BSC轮询出错: '+e.message,'err')}
  setTimeout(pollBSC,15000)}// 每15秒

// 从DexScreener查询BSC代币的社交链接
async function lookupBscTwitter(tk){
  try{
    const url=`https://api.dexscreener.com/latest/dex/tokens/${tk.ca}`;
    let data=null;
    try{const r=await fetch(url,{signal:AbortSignal.timeout(8000)});if(r.ok)data=await r.json()}catch(e){
      for(const px of PXS){try{const r=await fetch(px(url),{signal:AbortSignal.timeout(8000)});if(r.ok){data=await r.json();break}}catch(e2){}}}
    if(!data||!data.pairs)return;
    for(const pair of data.pairs){
      if(!pair.info||!pair.info.socials)continue;
      for(const s of pair.info.socials){
        if(s.type==='twitter'&&s.url){
          const m=s.url.match(/(?:twitter\.com|x\.com)\/([A-Za-z0-9_]+)/);
          if(m){
            tk.tw=m[1];const i=feeds.findIndex(f=>f.ca===tk.ca);if(i>=0)feeds[i].tw=m[1];rF();
            enqueue(tk);return}}}}
  }catch(e){}}

// ===== 推特验证 =====
function enqueue(tk){
  if(!tk.tw||!tk.ca||tk.ca.includes('...'))return;
  if(cache.has(tk.ca)&&Date.now()-cache.get(tk.ca).ts<CTTL)return;
  Q.push(tk);uS();if(!qRun)processQ()}

async function processQ(){
  if(qRun||!Q.length)return;qRun=true;
  while(Q.length>0){
    const tk=Q.shift();uS();
    try{await checkTw(tk)}catch(e){L(`推特检查出错 @${tk.tw}: ${e.message}`,'err')}
    nC++;uS();await sleep(CI)}
  qRun=false}

async function checkTw(tk){
  const h=tk.tw,addr=tk.ca;
  L(`检查 @${h} 是否发布合约 ${addr.substring(0,8)}...`);
  const fi=feeds.findIndex(f=>f.ca===addr);
  if(fi>=0){feeds[fi].ck=true;rF()}

  let mTw=[],mBio=false,ok=false;

  // === 策略1: Nitter RSS (最可靠) ===
  for(const host of NITTER_RSS){
    if(ok)break;
    const rssUrl=`${host}/${h}/rss`;
    for(const px of PXS){
      try{
        const r=await fetch(px(rssUrl),{signal:AbortSignal.timeout(8000)});
        if(!r.ok)continue;
        const xml=await r.text();
        if(!xml||xml.length<50||!xml.includes('<'))continue;
        // 解析RSS中的推文
        const items=xml.match(/<item>[\s\S]*?<\/item>/gi)||[];
        for(const item of items.slice(0,5)){
          const desc=item.match(/<description><!\[CDATA\[([\s\S]*?)\]\]>/i)||item.match(/<description>([\s\S]*?)<\/description>/i);
          const title=item.match(/<title><!\[CDATA\[([\s\S]*?)\]\]>/i)||item.match(/<title>([\s\S]*?)<\/title>/i);
          const text=((desc?desc[1]:'')+(title?title[1]:'')).replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\s+/g,' ').trim();
          if(text.toLowerCase().includes(addr.toLowerCase())){mTw.push(text.substring(0,500))}}
        ok=true;L(`RSS获取成功: ${host}`,'ok');break;
      }catch(e){continue}}}

  // === 策略2: Nitter HTML页面 ===
  if(!ok){
    for(const host of NITTER_RSS){
      if(ok)break;
      for(const px of PXS){
        try{
          const r=await fetch(px(`${host}/${h}`),{signal:AbortSignal.timeout(8000)});
          if(!r.ok)continue;
          const html=await r.text();
          if(!html||html.length<200)continue;
          // 提取推文内容
          const tws=[];
          const pats=[/<div[^>]*class="[^"]*tweet-content[^"]*"[^>]*>([\s\S]*?)<\/div>/gi,/<p[^>]*class="[^"]*tweet-text[^"]*"[^>]*>([\s\S]*?)<\/p>/gi];
          for(const p of pats){let m;while((m=p.exec(html))!==null&&tws.length<5){const t=m[1].replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();if(t.length>5)tws.push(t)}}
          // 兜底：全文搜索
          if(tws.length===0){const ft=html.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');tws.push(ft.substring(0,3000))}
          for(const t of tws){if(t.toLowerCase().includes(addr.toLowerCase()))mTw.push(t.substring(0,500))}
          // 检查bio
          const bioM=html.match(/<div[^>]*class="[^"]*profile-bio[^"]*"[^>]*>([\s\S]*?)<\/div>/i);
          if(bioM){const bio=bioM[1].replace(/<[^>]+>/g,' ').trim();if(bio.toLowerCase().includes(addr.toLowerCase()))mBio=true}
          ok=true;break;
        }catch(e){continue}}}}

  // === 策略3: Twitter syndication ===
  if(!ok){
    const synUrl=`https://syndication.twitter.com/srv/timeline-profile/screen-name/${h}`;
    for(const px of PXS){
      try{
        const r=await fetch(px(synUrl),{signal:AbortSignal.timeout(8000)});
        if(!r.ok)continue;
        const html=await r.text();
        if(!html||html.length<100)continue;
        const text=html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
        if(text.toLowerCase().includes(addr.toLowerCase()))mTw.push('[在推特时间线中找到合约地址]');
        ok=true;break;
      }catch(e){continue}}}

  cache.set(addr,{ts:Date.now(),hit:mTw.length>0||mBio});
  if(fi>=0){feeds[fi].ck=false;rF()}

  if(mTw.length>0||mBio){
    nM++;
    matches.unshift({name:tk.name,ca:addr,chain:tk.chain,tw:h,mc:tk.mc,mTw,mBio,ts:Date.now()});
    rM();uS();beep();
    L(`匹配成功! @${h} 发布了合约 ${addr.substring(0,12)}...`,'match');
    if(Notification.permission==='granted')new Notification('合约匹配!',{body:`${tk.name} (@${h}) - ${tk.chain.toUpperCase()}\n${addr}`})
  }else if(ok){L(`未匹配: @${h}`)}
  else{L(`无法获取 @${h} 的推文(所有代理失败)`,'warn')}}

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

// ===== 启动 =====
L('推特CA扫描神器启动中...','ok');
connSOL();
startBSC();
setInterval(()=>{const now=Date.now();for(const[k,v]of cache){if(now-v.ts>CTTL)cache.delete(k)}},5*60000);
</script>
