<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推特CA扫描神器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0e11;color:#eaecef;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
.header{background:#1a1d23;border-bottom:1px solid #2b2f36;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;color:#00c853}
.hdr-right{display:flex;align-items:center;gap:12px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;background:#f44336}
.dot.on{background:#00c853}
.ctrl{background:#1a1d23;border-bottom:1px solid #2b2f36;padding:10px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:5px 14px;border-radius:5px;border:1px solid #2b2f36;background:transparent;color:#848e9c;cursor:pointer;font-size:12px;transition:all .2s}
.btn.active{background:#00c853;color:#000;border-color:#00c853;font-weight:600}
.btn:hover:not(.active){border-color:#848e9c;color:#eaecef}
.btn.warn{background:#ff9800;color:#000;border-color:#ff9800}
.btn.err{background:#f44336;color:#fff;border-color:#f44336}
.stats{margin-left:auto;display:flex;gap:18px;font-size:12px;color:#848e9c}
.stats-val{color:#eaecef;font-weight:600}
.main{display:flex;height:calc(100vh - 180px)}
.panel{overflow-y:auto;padding:14px}
.panel-left{flex:2;border-right:1px solid #2b2f36}
.panel-right{flex:1}
.panel h2{font-size:14px;color:#848e9c;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #2b2f36}
.panel h2.green{color:#00c853}
.card{background:#1a1d23;border:1px solid #00c853;border-radius:8px;padding:14px;margin-bottom:10px;animation:slideIn .3s}
.card.flash{animation:flashGreen 1.5s}
@keyframes slideIn{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes flashGreen{0%{border-color:#0f0;box-shadow:0 0 20px rgba(0,200,83,.5)}100%{border-color:#00c853;box-shadow:none}}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.token-name{font-size:15px;font-weight:700;color:#fff}
.tag{padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase}
.tag.sol{background:rgba(153,69,255,.2);color:#b388ff}
.tag.bsc{background:rgba(243,186,47,.2);color:#f3ba2f}
.row{display:flex;align-items:flex-start;margin-bottom:5px;font-size:12px}
.label{color:#848e9c;min-width:72px;flex-shrink:0}
.value{color:#eaecef;word-break:break-all}
.value a{color:#1e88e5;text-decoration:none}
.value a:hover{text-decoration:underline}
.addr{font-family:'Courier New',monospace;font-size:11px;background:#0b0e11;padding:2px 5px;border-radius:3px;cursor:pointer}
.addr:hover{background:#2b2f36}
.tweet-box{background:#0b0e11;border-left:3px solid #00c853;padding:7px 10px;margin-top:6px;border-radius:0 4px 4px 0;font-size:12px;color:#b7bdc6;white-space:pre-wrap;word-break:break-word}
.time{color:#848e9c;font-size:10px;text-align:right;margin-top:4px}
.feed-item{padding:6px 10px;margin-bottom:4px;border-radius:5px;background:#1a1d23;font-size:11px;border-left:3px solid #2b2f36}
.feed-item.has-tw{border-left-color:#1e88e5}
.feed-item.checking{border-left-color:#ff9800}
.feed-name{font-weight:600;color:#eaecef;margin-bottom:1px}
.feed-detail{color:#848e9c;font-size:10px}
.empty{text-align:center;padding:50px 20px;color:#848e9c}
.empty .icon{font-size:40px;margin-bottom:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#00c853;color:#000;padding:7px 18px;border-radius:5px;font-size:12px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#0b0e11}
::-webkit-scrollbar-thumb{background:#2b2f36;border-radius:3px}
.log-box{background:#0b0e11;border:1px solid #2b2f36;border-radius:6px;padding:10px;margin:0 20px;max-height:150px;overflow-y:auto;font-family:monospace;font-size:11px;color:#848e9c}
.highlight{color:#ff0;background:rgba(255,255,0,.15);padding:0 2px;border-radius:2px}
.manual-link{display:inline-block;margin-left:8px;font-size:11px;padding:1px 6px;background:#2b2f36;border-radius:3px;color:#1e88e5;text-decoration:none}
.manual-link:hover{background:#3b3f46}
.err-banner{background:#f44336;color:#fff;padding:12px 20px;font-size:13px;display:none}
.err-banner.show{display:block}
.test-bar{background:#1a1d23;border-bottom:1px solid #2b2f36;padding:8px 20px;display:flex;gap:8px;align-items:center;font-size:12px}
.test-bar input{background:#0b0e11;border:1px solid #2b2f36;color:#eaecef;padding:4px 10px;border-radius:4px;font-size:12px;width:200px}
.test-bar input::placeholder{color:#555}
.test-result{padding:4px 10px;font-size:11px;color:#848e9c;max-width:600px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.test-result.ok{color:#00c853}
.test-result.fail{color:#f44336}
.pipeline{display:flex;gap:14px;font-size:11px;color:#848e9c;padding:4px 20px 6px;background:#0b0e11;border-bottom:1px solid #2b2f36}
.pipeline span{display:flex;align-items:center;gap:4px}
.pipeline .pv{color:#eaecef;font-weight:600}
.pipeline .arrow{color:#2b2f36}
</style>
</head>
<body>

<div class="err-banner" id="errBanner"></div>

<div class="header">
  <h1>推特CA扫描神器</h1>
  <div class="hdr-right">
    <span><span class="dot" id="solDot"></span>SOL: <span id="solStatus">离线</span></span>
    <span><span class="dot" id="bscDot"></span>BSC: <span id="bscStatus">离线</span></span>
    <span>推特: <span id="twStatus" style="color:#f44336">未检测</span></span>
    <button class="btn" id="soundBtn" onclick="toggleSound()">声音 关</button>
    <button class="btn" id="logBtn" onclick="toggleLog()">隐藏日志</button>
  </div>
</div>

<div class="test-bar">
  <span style="color:#848e9c">推特测试:</span>
  <input type="text" id="testInput" placeholder="输入推特用户名 如 elonmusk" onkeydown="if(event.key==='Enter')runTest()">
  <button class="btn" onclick="runTest()">测试</button>
  <button class="btn" onclick="runSelfTest()">自动检测</button>
  <span class="test-result" id="testResult"></span>
</div>

<div class="ctrl">
  <button class="btn active" onclick="setFilter('all',this)">全部</button>
  <button class="btn" onclick="setFilter('sol',this)">SOL</button>
  <button class="btn" onclick="setFilter('bsc',this)">BSC</button>
  <div class="stats">
    <span>匹配: <span class="stats-val" id="statMatch">0</span></span>
    <span>扫描: <span class="stats-val" id="statScan">0</span></span>
    <span>有推特: <span class="stats-val" id="statTw">0</span></span>
    <span>已查: <span class="stats-val" id="statCheck">0</span></span>
    <span>成功: <span class="stats-val" id="statOk" style="color:#00c853">0</span></span>
    <span>失败: <span class="stats-val" id="statFail" style="color:#f44336">0</span></span>
    <span>队列: <span class="stats-val" id="statQueue">0</span></span>
  </div>
</div>

<div class="log-box" id="logBox">
  <div style="color:#00c853">[启动] 页面已加载，正在初始化...</div>
</div>

<div class="main">
  <div class="panel panel-left">
    <h2 class="green">合约地址匹配结果</h2>
    <div id="matchList">
      <div class="empty">
        <div class="icon">&#128269;</div>
        <p>等待匹配中...</p>
        <p style="margin-top:6px;font-size:11px">当新币的推特发布了其合约地址，将在这里显示</p>
      </div>
    </div>
  </div>
  <div class="panel panel-right">
    <h2>实时新币流</h2>
    <div id="feedList">
      <div class="empty">
        <div class="icon">&#9201;</div>
        <p>正在连接数据源...</p>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">已复制!</div>

<script>
// ========== 全局错误捕获 ==========
window.onerror = function(msg, url, line) {
  showError('JS错误: ' + msg + ' (行' + line + ')');
  log('JS错误: ' + msg + ' 行:' + line, 'err');
  return false;
};
window.onunhandledrejection = function(e) {
  log('Promise错误: ' + (e.reason ? e.reason.message || String(e.reason) : '未知'), 'err');
};

function showError(msg) {
  var el = document.getElementById('errBanner');
  if (el) { el.textContent = msg; el.classList.add('show'); }
}

// ========== AbortSignal.timeout 兼容 ==========
if (typeof AbortSignal !== 'undefined' && !AbortSignal.timeout) {
  AbortSignal.timeout = function(ms) {
    var ctrl = new AbortController();
    setTimeout(function() { try { ctrl.abort(); } catch(e){} }, ms);
    return ctrl.signal;
  };
}

// ========== 状态变量 ==========
var currentFilter = 'all';
var soundOn = false;
var matchesArr = [];
var feedsArr = [];
var scanCount = 0;
var twCount = 0;
var checkCount = 0;
var checkOk = 0;
var checkFail = 0;
var matchCount = 0;
var audioCtx = null;
var queue = [];
var queueRunning = false;
var resultCache = new Map();
var CACHE_TTL = 30 * 60000;
var CHECK_INTERVAL = 1000;

// ========== 工作中的推特源(自检后动态排序) ==========
var workingSources = [];

// ========== CORS代理 ==========
var PROXIES = [
  function(u) { return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); },
  function(u) { return 'https://corsproxy.io/?' + encodeURIComponent(u); },
  function(u) { return 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u); },
  function(u) { return 'https://cors-anywhere.herokuapp.com/' + u; },
  function(u) { return 'https://crossorigin.me/' + u; }
];

// ========== 推特内容源 ==========
// 每个源: { name, type, getUrl(handle), parseContent(text) => string[] }
var TWITTER_SOURCES = [
  // Nitter实例 - RSS
  { name: 'xcancel.com/RSS', type: 'rss', getUrl: function(h) { return 'https://xcancel.com/' + h + '/rss'; } },
  { name: 'nitter.poast.org/RSS', type: 'rss', getUrl: function(h) { return 'https://nitter.poast.org/' + h + '/rss'; } },
  { name: 'nitter.privacydev.net/RSS', type: 'rss', getUrl: function(h) { return 'https://nitter.privacydev.net/' + h + '/rss'; } },
  { name: 'nitter.cz/RSS', type: 'rss', getUrl: function(h) { return 'https://nitter.cz/' + h + '/rss'; } },
  { name: 'bird.habedieehre.net/RSS', type: 'rss', getUrl: function(h) { return 'https://bird.habedieehre.net/' + h + '/rss'; } },
  { name: 'nitter.perennialte.ch/RSS', type: 'rss', getUrl: function(h) { return 'https://nitter.perennialte.ch/' + h + '/rss'; } },
  // Nitter实例 - HTML页面
  { name: 'xcancel.com/HTML', type: 'html', getUrl: function(h) { return 'https://xcancel.com/' + h; } },
  { name: 'nitter.poast.org/HTML', type: 'html', getUrl: function(h) { return 'https://nitter.poast.org/' + h; } },
  { name: 'nitter.cz/HTML', type: 'html', getUrl: function(h) { return 'https://nitter.cz/' + h; } },
  // Twitter syndication
  { name: 'Twitter Syndication', type: 'syndication', getUrl: function(h) { return 'https://syndication.twitter.com/srv/timeline-profile/screen-name/' + h; } },
];

// ========== 日志 ==========
function log(msg, type) {
  type = type || 'info';
  var box = document.getElementById('logBox');
  if (!box) return;
  var colors = { info: '#848e9c', ok: '#00c853', warn: '#ff9800', err: '#f44336', match: '#00ff6a' };
  var now = new Date();
  var ts = now.toLocaleTimeString('zh-CN', { hour12: false });
  var div = document.createElement('div');
  div.style.color = colors[type] || '#848e9c';
  div.textContent = '[' + ts + '] ' + msg;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  if (box.children.length > 500) box.removeChild(box.firstChild);
  console.log('[' + type + '] ' + msg);
}

var logVisible = true;
function toggleLog() {
  logVisible = !logVisible;
  document.getElementById('logBox').style.display = logVisible ? 'block' : 'none';
  document.getElementById('logBtn').textContent = logVisible ? '隐藏日志' : '显示日志';
}

// ========== 声音 ==========
function initAudio() {
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function beep() {
  if (!soundOn || !audioCtx) return;
  try {
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.setValueAtTime(880, audioCtx.currentTime);
    o.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.1);
    o.frequency.setValueAtTime(1320, audioCtx.currentTime + 0.2);
    g.gain.setValueAtTime(0.3, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
    o.start(); o.stop(audioCtx.currentTime + 0.6);
  } catch(e) {}
}
function toggleSound() {
  if (!audioCtx) initAudio();
  soundOn = !soundOn;
  var btn = document.getElementById('soundBtn');
  btn.textContent = soundOn ? '声音 开' : '声音 关';
  if (soundOn) btn.classList.add('active'); else btn.classList.remove('active');
  if (soundOn && typeof Notification !== 'undefined' && Notification.permission === 'default') Notification.requestPermission();
}

// ========== 界面工具 ==========
function setFilter(chain, btn) {
  currentFilter = chain;
  var btns = document.querySelectorAll('.ctrl .btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  btn.classList.add('active');
  renderMatches(); renderFeed();
}
function updateStats() {
  document.getElementById('statMatch').textContent = matchCount;
  document.getElementById('statScan').textContent = scanCount;
  document.getElementById('statTw').textContent = twCount;
  document.getElementById('statCheck').textContent = checkCount;
  document.getElementById('statOk').textContent = checkOk;
  document.getElementById('statFail').textContent = checkFail;
  document.getElementById('statQueue').textContent = queue.length;
}
function escapeHtml(s) {
  if (!s) return '';
  var d = document.createElement('div'); d.textContent = String(s); return d.innerHTML;
}
function formatTime(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  return d.toLocaleTimeString('zh-CN', { hour12: false }) + ' ' + d.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
}
function copyAddr(addr) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(addr).then(function() {
      var t = document.getElementById('toast'); t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 1200);
    });
  } else {
    var ta = document.createElement('textarea');
    ta.value = addr; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    var t = document.getElementById('toast'); t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 1200);
  }
}

// ========== 渲染 ==========
function renderMatches() {
  var el = document.getElementById('matchList');
  var list = currentFilter === 'all' ? matchesArr : matchesArr.filter(function(m) { return m.chain === currentFilter; });
  if (!list.length) { el.innerHTML = '<div class="empty"><div class="icon">&#128269;</div><p>暂无匹配</p></div>'; return; }
  var html = '';
  for (var i = 0; i < list.length; i++) {
    var m = list[i];
    html += '<div class="card ' + (i === 0 ? 'flash' : '') + '">';
    html += '<div class="card-head"><span class="token-name">' + escapeHtml(m.name) + '</span><span class="tag ' + m.chain + '">' + m.chain.toUpperCase() + '</span></div>';
    html += '<div class="row"><span class="label">合约:</span><span class="value"><span class="addr" onclick="copyAddr(\'' + escapeHtml(m.ca) + '\')" title="点击复制">' + escapeHtml(m.ca) + '</span></span></div>';
    html += '<div class="row"><span class="label">推特:</span><span class="value"><a href="https://x.com/' + escapeHtml(m.tw) + '" target="_blank">@' + escapeHtml(m.tw) + '</a><a class="manual-link" href="https://x.com/' + escapeHtml(m.tw) + '" target="_blank">打开推特</a></span></div>';
    if (m.mc) html += '<div class="row"><span class="label">市值:</span><span class="value">' + escapeHtml(m.mc) + '</span></div>';
    if (m.matchedTweets) { for (var j = 0; j < m.matchedTweets.length; j++) html += '<div class="tweet-box">' + highlightAddr(escapeHtml(m.matchedTweets[j]), escapeHtml(m.ca)) + '</div>'; }
    if (m.matchedBio) html += '<div class="tweet-box" style="border-left-color:#1e88e5">在推特简介中找到合约地址</div>';
    html += '<div class="time">' + formatTime(m.ts) + '</div></div>';
  }
  el.innerHTML = html;
}
function highlightAddr(text, addr) {
  if (!addr || addr.length < 10) return text;
  var idx = text.toLowerCase().indexOf(addr.toLowerCase());
  if (idx === -1) return text;
  return text.substring(0, idx) + '<span class="highlight">' + text.substring(idx, idx + addr.length) + '</span>' + text.substring(idx + addr.length);
}
function renderFeed() {
  var el = document.getElementById('feedList');
  var list = currentFilter === 'all' ? feedsArr : feedsArr.filter(function(f) { return f.chain === currentFilter; });
  if (!list.length) { el.innerHTML = '<div class="empty"><div class="icon">&#9201;</div><p>等待新币...</p></div>'; return; }
  var html = '';
  var max = Math.min(list.length, 150);
  for (var i = 0; i < max; i++) {
    var f = list[i];
    html += '<div class="feed-item' + (f.tw ? ' has-tw' : '') + (f.checking ? ' checking' : '') + '">';
    html += '<div class="feed-name">' + escapeHtml(f.name) + ' <span class="tag ' + f.chain + '" style="font-size:9px">' + f.chain.toUpperCase() + '</span></div>';
    var d = ''; if (f.ca) d += escapeHtml(f.ca.substring(0, 6)) + '...' + escapeHtml(f.ca.slice(-4));
    if (f.tw) d += ' | @' + escapeHtml(f.tw); d += ' | ' + formatTime(f.ts);
    html += '<div class="feed-detail">' + d + '</div></div>';
  }
  el.innerHTML = html;
}
function addFeed(token) {
  feedsArr.unshift(token);
  if (feedsArr.length > 500) feedsArr = feedsArr.slice(0, 500);
  scanCount++;
  renderFeed(); updateStats();
}

// ========== 安全fetch ==========
function safeFetch(url, timeoutMs) {
  timeoutMs = timeoutMs || 10000;
  var opts = {};
  try { opts.signal = AbortSignal.timeout(timeoutMs); } catch(e) {
    var ctrl = new AbortController();
    setTimeout(function() { try { ctrl.abort(); } catch(e2){} }, timeoutMs);
    opts.signal = ctrl.signal;
  }
  return fetch(url, opts);
}

// ========== 通过代理获取文本 ==========
function fetchTextWithProxies(url, timeoutMs) {
  timeoutMs = timeoutMs || 10000;
  function tryFetch(fetchUrl) {
    return safeFetch(fetchUrl, timeoutMs).then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    });
  }
  // 先直连
  return tryFetch(url).catch(function() {
    // 依次尝试代理
    var idx = 0;
    function tryNext() {
      if (idx >= PROXIES.length) return Promise.reject(new Error('所有代理均失败'));
      var proxyUrl = PROXIES[idx](url);
      idx++;
      return tryFetch(proxyUrl).catch(function() { return tryNext(); });
    }
    return tryNext();
  });
}

function fetchJsonWithProxies(url, timeoutMs) {
  return fetchTextWithProxies(url, timeoutMs).then(function(t) { return JSON.parse(t); });
}

// ==========================================================
//  推特内容获取 - 核心函数
// ==========================================================

// 从RSS XML中提取推文文本
function parseRSS(xml) {
  var tweets = [];
  var items = xml.match(/<item>[\s\S]*?<\/item>/gi) || [];
  var count = Math.min(items.length, 5);
  for (var i = 0; i < count; i++) {
    var desc = items[i].match(/<description><!\[CDATA\[([\s\S]*?)\]\]>/i) || items[i].match(/<description>([\s\S]*?)<\/description>/i);
    var title = items[i].match(/<title><!\[CDATA\[([\s\S]*?)\]\]>/i) || items[i].match(/<title>([\s\S]*?)<\/title>/i);
    var text = ((desc ? desc[1] : '') + ' ' + (title ? title[1] : ''))
      .replace(/<[^>]+>/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/\s+/g, ' ').trim();
    if (text.length > 3) tweets.push(text);
  }
  return tweets;
}

// 从Nitter HTML中提取推文文本和bio
function parseNitterHTML(html) {
  var tweets = [];
  var bio = '';
  // 推文内容
  var patterns = [
    /<div[^>]*class="[^"]*tweet-content[^"]*"[^>]*>([\s\S]*?)<\/div>/gi,
    /<p[^>]*class="[^"]*tweet-text[^"]*"[^>]*>([\s\S]*?)<\/p>/gi
  ];
  for (var p = 0; p < patterns.length; p++) {
    var m;
    while ((m = patterns[p].exec(html)) !== null && tweets.length < 5) {
      var t = m[1].replace(/<[^>]+>/g, ' ').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
      if (t.length > 5) tweets.push(t);
    }
  }
  // 兜底全文
  if (tweets.length === 0) {
    var full = html.replace(/<script[\s\S]*?<\/script>/gi, '').replace(/<style[\s\S]*?<\/style>/gi, '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
    if (full.length > 50) tweets.push(full.substring(0, 3000));
  }
  // Bio
  var bioM = html.match(/<div[^>]*class="[^"]*profile-bio[^"]*"[^>]*>([\s\S]*?)<\/div>/i);
  if (bioM) bio = bioM[1].replace(/<[^>]+>/g, ' ').trim();
  return { tweets: tweets, bio: bio };
}

// 从syndication HTML中提取内容
function parseSyndicationHTML(html) {
  var text = html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
  return { tweets: [text.substring(0, 3000)], bio: '' };
}

// 尝试单个源获取推特内容(用指定代理)
function fetchFromSource(source, handle, proxyFn) {
  var url = source.getUrl(handle);
  var fetchUrl = proxyFn ? proxyFn(url) : url;
  return safeFetch(fetchUrl, 8000).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function(text) {
    if (!text || text.length < 50) throw new Error('空内容');
    if (source.type === 'rss') {
      if (text.indexOf('<item>') === -1 && text.indexOf('<item ') === -1) throw new Error('非RSS');
      return { tweets: parseRSS(text), bio: '', source: source.name };
    } else if (source.type === 'html') {
      var r = parseNitterHTML(text);
      return { tweets: r.tweets, bio: r.bio, source: source.name };
    } else if (source.type === 'syndication') {
      var r2 = parseSyndicationHTML(text);
      return { tweets: r2.tweets, bio: r2.bio, source: source.name };
    }
    throw new Error('未知源类型');
  });
}

// 获取某个推特用户的内容（遍历所有源+代理）
function fetchTwitterContent(handle) {
  // 如果有已知可用的源，优先用
  var sources = workingSources.length > 0 ? workingSources.concat(TWITTER_SOURCES) : TWITTER_SOURCES;
  // 去重
  var seen = {};
  var uniqueSources = [];
  for (var i = 0; i < sources.length; i++) {
    if (!seen[sources[i].name]) { seen[sources[i].name] = true; uniqueSources.push(sources[i]); }
  }

  var srcIdx = 0;
  function trySource() {
    if (srcIdx >= uniqueSources.length) return Promise.reject(new Error('所有推特源均失败'));
    var src = uniqueSources[srcIdx];
    srcIdx++;

    // 先直连，再代理
    var pxIdx = -1; // -1 = 直连
    function tryProxy() {
      if (pxIdx >= PROXIES.length) return trySource(); // 这个源所有代理都失败，试下一个源
      var proxyFn = pxIdx === -1 ? null : PROXIES[pxIdx];
      pxIdx++;
      return fetchFromSource(src, handle, proxyFn).then(function(result) {
        // 成功！记录可用源
        if (workingSources.indexOf(src) === -1) {
          workingSources.unshift(src);
          if (workingSources.length > 3) workingSources = workingSources.slice(0, 3);
        }
        return result;
      }).catch(function() {
        return tryProxy();
      });
    }
    return tryProxy();
  }
  return trySource();
}

// ==========================================================
//  自检 & 手动测试
// ==========================================================
function runSelfTest() {
  log('开始自动检测推特源可用性...', 'warn');
  document.getElementById('testResult').textContent = '检测中...';
  document.getElementById('testResult').className = 'test-result';
  document.getElementById('twStatus').textContent = '检测中';
  document.getElementById('twStatus').style.color = '#ff9800';
  workingSources = []; // 重置

  var testHandle = 'elonmusk';
  var results = [];
  var total = 0;

  // 测试每个源(只用第一个代理，快速)
  function testNext(idx) {
    if (idx >= TWITTER_SOURCES.length) {
      // 汇总
      var ok = results.filter(function(r) { return r.ok; });
      log('检测完成: ' + ok.length + '/' + total + ' 个推特源可用', ok.length > 0 ? 'ok' : 'err');
      for (var i = 0; i < results.length; i++) {
        log('  ' + results[i].name + ': ' + (results[i].ok ? '可用 (' + results[i].tweets + '条推文)' : '不可用'), results[i].ok ? 'ok' : 'err');
      }
      if (ok.length > 0) {
        workingSources = ok.map(function(r) { return r.source; });
        document.getElementById('testResult').textContent = ok.length + ' 个推特源可用';
        document.getElementById('testResult').className = 'test-result ok';
        document.getElementById('twStatus').textContent = '可用(' + ok.length + '源)';
        document.getElementById('twStatus').style.color = '#00c853';
      } else {
        document.getElementById('testResult').textContent = '所有推特源不可用！推特检查功能无法工作';
        document.getElementById('testResult').className = 'test-result fail';
        document.getElementById('twStatus').textContent = '不可用';
        document.getElementById('twStatus').style.color = '#f44336';
      }
      return;
    }

    var src = TWITTER_SOURCES[idx];
    total++;
    // 尝试直连 + 前2个代理
    var attempts = [null, PROXIES[0], PROXIES[1]];
    var aIdx = 0;
    function tryAttempt() {
      if (aIdx >= attempts.length) {
        results.push({ name: src.name, ok: false, source: src });
        testNext(idx + 1);
        return;
      }
      var proxyFn = attempts[aIdx];
      aIdx++;
      fetchFromSource(src, testHandle, proxyFn).then(function(r) {
        results.push({ name: src.name, ok: true, tweets: r.tweets.length, source: src });
        testNext(idx + 1);
      }).catch(function() {
        tryAttempt();
      });
    }
    tryAttempt();
  }
  testNext(0);
}

function runTest() {
  var handle = document.getElementById('testInput').value.trim().replace(/^@/, '');
  if (!handle) { handle = 'elonmusk'; document.getElementById('testInput').value = handle; }
  log('手动测试: 获取 @' + handle + ' 的推文...', 'warn');
  document.getElementById('testResult').textContent = '获取中...';
  document.getElementById('testResult').className = 'test-result';

  fetchTwitterContent(handle).then(function(result) {
    var msg = '成功! 来源: ' + result.source + ' | 获取到 ' + result.tweets.length + ' 条内容';
    if (result.tweets.length > 0) msg += ' | 首条: ' + result.tweets[0].substring(0, 80) + '...';
    log('测试结果: ' + msg, 'ok');
    document.getElementById('testResult').textContent = msg;
    document.getElementById('testResult').className = 'test-result ok';
  }).catch(function(e) {
    var msg = '失败: ' + e.message;
    log('测试结果: ' + msg, 'err');
    document.getElementById('testResult').textContent = msg;
    document.getElementById('testResult').className = 'test-result fail';
  });
}

// ==========================================================
//  SOL链: PumpPortal WebSocket
// ==========================================================
var solWs = null;
var solReconnectDelay = 1000;

function connectSOL() {
  log('正在连接 PumpPortal (SOL)...');
  try { solWs = new WebSocket('wss://pumpportal.fun/api/data'); }
  catch(e) { log('WebSocket创建失败: ' + e.message, 'err'); setTimeout(connectSOL, solReconnectDelay); return; }

  solWs.onopen = function() {
    log('SOL 数据源已连接', 'ok');
    document.getElementById('solDot').classList.add('on');
    document.getElementById('solStatus').textContent = '在线';
    solReconnectDelay = 1000;
    solWs.send(JSON.stringify({ method: 'subscribeNewToken' }));
  };
  solWs.onmessage = function(ev) {
    try {
      var d = JSON.parse(ev.data);
      if (!d.mint) return;
      var token = { name: d.name || d.symbol || '未知', ca: d.mint, chain: 'sol', tw: null,
        mc: d.marketCapSol ? Number(d.marketCapSol).toFixed(1) + ' SOL' : null, uri: d.uri || null, ts: Date.now() };
      addFeed(token);
      if (token.uri) fetchTokenMeta(token);
    } catch(e) {}
  };
  solWs.onclose = function() {
    log('SOL 连接断开，重连中...', 'warn');
    document.getElementById('solDot').classList.remove('on');
    document.getElementById('solStatus').textContent = '离线';
    solReconnectDelay = Math.min(solReconnectDelay * 2, 30000);
    setTimeout(connectSOL, solReconnectDelay);
  };
  solWs.onerror = function() { try { solWs.close(); } catch(e) {} };
}

function fetchTokenMeta(token) {
  var url = token.uri;
  if (!url) return;
  if (url.indexOf('ipfs://') === 0) url = 'https://ipfs.io/ipfs/' + url.slice(7);

  fetchJsonWithProxies(url, 8000).then(function(d) {
    if (!d) return;
    var tw = d.twitter || d.x || '';
    if (!tw && d.extensions) tw = d.extensions.twitter || d.extensions.x || '';
    if (!tw && d.social) tw = d.social.twitter || d.social.x || '';
    if (!tw) return;
    var m = tw.match(/(?:twitter\.com|x\.com)\/([A-Za-z0-9_]+)/);
    tw = m ? m[1] : tw.replace(/^@/, '').replace(/^https?:\/\//, '').split('/')[0].trim();
    if (tw && tw.length >= 2 && tw.length <= 15) {
      token.tw = tw;
      twCount++;
      for (var i = 0; i < feedsArr.length; i++) { if (feedsArr[i].ca === token.ca) { feedsArr[i].tw = tw; break; } }
      renderFeed(); updateStats();
      enqueueCheck(token);
    }
  }).catch(function() {});
}

// ==========================================================
//  BSC链: GeckoTerminal
// ==========================================================
var bscSeenAddrs = new Set();

function startBSC() {
  log('正在启动 BSC 扫描 (GeckoTerminal)...');
  document.getElementById('bscDot').classList.add('on');
  document.getElementById('bscStatus').textContent = '轮询中';
  pollBSC();
}

function pollBSC() {
  var url = 'https://api.geckoterminal.com/api/v2/networks/bsc/new_pools?include=base_token&page=1';
  fetchJsonWithProxies(url, 15000).then(function(data) {
    if (!data || !data.data || !Array.isArray(data.data)) { log('BSC: 数据异常', 'warn'); return; }
    log('BSC: 获取到 ' + data.data.length + ' 个新池子', 'ok');
    var tokenMap = {};
    if (data.included && Array.isArray(data.included)) {
      for (var i = 0; i < data.included.length; i++) {
        var inc = data.included[i];
        if (inc.type === 'token' && inc.attributes) tokenMap[inc.id] = inc.attributes;
      }
    }
    for (var j = 0; j < data.data.length; j++) {
      var pool = data.data[j], attr = pool.attributes || {}, rel = pool.relationships || {};
      var btId = (rel.base_token && rel.base_token.data) ? rel.base_token.data.id : '';
      var addr = btId.indexOf('bsc_') === 0 ? btId.slice(4) : btId;
      if (!addr || bscSeenAddrs.has(addr)) continue;
      bscSeenAddrs.add(addr);
      var tInfo = tokenMap[btId] || {};
      var token = { name: tInfo.name || tInfo.symbol || attr.name || '未知', ca: addr, chain: 'bsc', tw: null,
        mc: attr.fdv_usd ? '$' + Number(attr.fdv_usd).toLocaleString() : null, ts: Date.now() };
      addFeed(token);
      lookupBscTwitter(token);
    }
  }).catch(function(e) { log('BSC 轮询出错: ' + e.message, 'err'); })
    .finally(function() { setTimeout(pollBSC, 15000); });
}

function lookupBscTwitter(token) {
  var url = 'https://api.dexscreener.com/latest/dex/tokens/' + token.ca;
  fetchJsonWithProxies(url, 10000).then(function(data) {
    if (!data || !data.pairs) return;
    for (var i = 0; i < data.pairs.length; i++) {
      var pair = data.pairs[i];
      if (!pair.info || !pair.info.socials) continue;
      for (var j = 0; j < pair.info.socials.length; j++) {
        var s = pair.info.socials[j];
        if (s.type === 'twitter' && s.url) {
          var m = s.url.match(/(?:twitter\.com|x\.com)\/([A-Za-z0-9_]+)/);
          if (m) {
            token.tw = m[1]; twCount++;
            for (var k = 0; k < feedsArr.length; k++) { if (feedsArr[k].ca === token.ca) { feedsArr[k].tw = m[1]; break; } }
            renderFeed(); updateStats();
            enqueueCheck(token); return;
          }
        }
      }
    }
  }).catch(function() {});
}

// ==========================================================
//  推特验证队列
// ==========================================================
function enqueueCheck(token) {
  if (!token.tw || !token.ca) return;
  if (resultCache.has(token.ca) && Date.now() - resultCache.get(token.ca).ts < CACHE_TTL) return;
  queue.push(token); updateStats();
  if (!queueRunning) processQueue();
}

function processQueue() {
  if (queueRunning || queue.length === 0) return;
  queueRunning = true;
  function next() {
    if (queue.length === 0) { queueRunning = false; return; }
    var token = queue.shift(); updateStats();
    checkTwitter(token).then(function() {
      checkCount++; updateStats();
      return sleep(CHECK_INTERVAL);
    }).then(next).catch(function(e) {
      log('推特检查异常 @' + token.tw + ': ' + e.message, 'err');
      checkCount++; checkFail++; updateStats();
      sleep(CHECK_INTERVAL).then(next);
    });
  }
  next();
}

function checkTwitter(token) {
  var handle = token.tw, addr = token.ca;
  log('检查 @' + handle + ' → ' + addr.substring(0, 8) + '...');
  for (var i = 0; i < feedsArr.length; i++) { if (feedsArr[i].ca === addr) { feedsArr[i].checking = true; break; } }
  renderFeed();

  return fetchTwitterContent(handle).then(function(result) {
    var matchedTweets = [];
    var matchedBio = false;

    // 检查推文内容
    for (var i = 0; i < result.tweets.length; i++) {
      if (result.tweets[i].toLowerCase().indexOf(addr.toLowerCase()) !== -1) {
        matchedTweets.push(result.tweets[i].substring(0, 500));
      }
    }
    // 检查bio
    if (result.bio && result.bio.toLowerCase().indexOf(addr.toLowerCase()) !== -1) matchedBio = true;

    // 更新缓存和UI
    checkOk++;
    resultCache.set(addr, { ts: Date.now(), hit: matchedTweets.length > 0 || matchedBio });
    for (var j = 0; j < feedsArr.length; j++) { if (feedsArr[j].ca === addr) { feedsArr[j].checking = false; break; } }
    renderFeed();

    if (matchedTweets.length > 0 || matchedBio) {
      matchCount++;
      matchesArr.unshift({ name: token.name, ca: addr, chain: token.chain, tw: handle, mc: token.mc,
        matchedTweets: matchedTweets, matchedBio: matchedBio, ts: Date.now() });
      renderMatches(); updateStats(); beep();
      log('匹配成功! @' + handle + ' 发布了合约 ' + addr.substring(0, 12) + '...', 'match');
      if (typeof Notification !== 'undefined' && Notification.permission === 'granted')
        new Notification('合约匹配!', { body: token.name + ' (@' + handle + ') - ' + token.chain.toUpperCase() + '\n' + addr });
    } else {
      log('未匹配: @' + handle + ' (来源:' + result.source + ')');
    }
  }).catch(function(e) {
    checkFail++;
    for (var i = 0; i < feedsArr.length; i++) { if (feedsArr[i].ca === addr) { feedsArr[i].checking = false; break; } }
    renderFeed();
    resultCache.set(addr, { ts: Date.now(), hit: false });
    log('获取失败 @' + handle + ': ' + e.message, 'warn');
  });
}

function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

// ==========================================================
//  启动
// ==========================================================
log('推特CA扫描神器 v3.0 启动', 'ok');
log('浏览器: ' + navigator.userAgent.substring(0, 60), 'info');

if (typeof fetch === 'undefined' || typeof WebSocket === 'undefined' || typeof Promise === 'undefined') {
  showError('浏览器不兼容，请使用最新版 Chrome/Edge/Firefox');
} else {
  log('兼容性检查通过', 'ok');
  try { connectSOL(); } catch(e) { log('SOL启动失败: ' + e.message, 'err'); }
  try { startBSC(); } catch(e) { log('BSC启动失败: ' + e.message, 'err'); }

  // 3秒后自动检测推特源
  setTimeout(function() {
    log('自动检测推特源可用性...', 'warn');
    runSelfTest();
  }, 3000);

  // 定期清理缓存
  setInterval(function() {
    var now = Date.now();
    resultCache.forEach(function(v, k) { if (now - v.ts > CACHE_TTL) resultCache.delete(k); });
  }, 5 * 60000);
}
